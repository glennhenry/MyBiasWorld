<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Cafe.TopicList</title>
  <th:block th:replace="~{fragments/topbar :: topbar-styles}"></th:block>
  <style>
    .content {
      padding-left: 0;
      padding-top: 4px;
    }

    .back-link {
      padding-left: 4px;
    }

    .topic-lists-container {
      padding: 8px;
    }

    .topic-lists-header {
      padding: 4px 0px;
      color: white;
      background: var(--primary-gradient);
    }

    .section-title {
      padding-left: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .cafe-actions {
      display: flex;
      align-items: center;
      padding: 4px;
      padding-left: 2px;
      background: linear-gradient(to bottom, white, #eaf5ff);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .post-list-item {
      display: grid;
      grid-template-columns: 457px 20px 5px 200px;
      padding: 4px 0px;
      background: var(--white-to-gray-gradient);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      line-height: 1.3;
    }

    .topic-details {
      display: flex;
      align-items: center;
      padding-left: 4px;
      padding-right: 4px;
      gap: 4px;
    }

    .author-avatar {
      border: 1px solid #ccc;
    }

    .author-avatar img {
      padding: 1px;
    }

    .topic-title-column {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .topic-title {
      /* topic-details is 462px grid, minus padding and gap */
      width: max-content;
      max-width: 400px;
      color: var(--sea-blue-600);
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topic-title:hover {
      color: var(--sea-blue-550);
    }

    .topic-description {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .topic-author-name {
      /* topic-details is 462px grid, minus padding and gap, and preserve space for date and like reply */
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--sea-blue-500);
    }

    .topic-stat-row {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: 2px;
      font-size: 12px;
    }

    .topic-options {
      position: relative;
      justify-self: end;
      margin-top: 3px;
    }

    .topic-options-btn {
      display: none;
    }

    .post-list-item:hover .topic-options-btn {
      display: block;
    }

    .post-list-item.menu-open .topic-options-btn {
      display: block;
    }

    .topic-options-popup {
      width: max-content;
      position: absolute;
      top: -20px;
      left: 10px;
      background-color: white;
      border: 1px solid #ccc;
      z-index: 1;
    }

    .topic-options-item {
      padding: 4px;
    }

    .topic-options-item:not(:last-child) {
      border-bottom: 1px solid #ccc;
    }

    .icon-button-text {
      all: unset;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .icon-button-text:hover {
      text-decoration: underline;
    }

    .divider {
      width: 2px;
      height: 90%;
      align-self: center;
      background-color: var(--muted-blue-500);
    }

    .topic-last-post {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
    }

    .last-post-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .last-post-details a {
      /* last-post-details is 200px grid, minus padding, gap, and avatar size */
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--sea-blue-500);
    }

    .last-post-details p {
      font-size: 10px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <a class="link back-link" href="/cafe">← Back to Cafe</a>
            <div class="topic-lists-container">
              <div class="topic-lists-header">
                <p class="section-title" th:text="${#strings.capitalize(data.sectionName)}"></p>
              </div>
              <div class="cafe-actions">
                <a class="icon-link" th:href="${data.sectionId} + '/write'">
                  <img src="/icons/pencil.png" width="24px" alt="House">
                  <p>Write a topic</p>
                </a>
              </div>
              <ul class="topic-lists" th:if="${not #lists.isEmpty(data.topics)}">
                <li class="post-list-item" th:each="topic : ${data.topics}">
                  <div class="topic-details">
                    <div class="author-avatar">
                      <img th:src="'/' + ${topic.authorAvatarUrl}" width="40px">
                    </div>
                    <div class="topic-title-column">
                      <a class="topic-title" th:href="${topic.link}" th:text="${topic.title}"></a>
                      <div class="topic-description">
                        by <a class="topic-author-name" th:text="${topic.authorName}"
                          th:href="${topic.authorProfileUrl}"></a>—
                        <p class="js-format-date" th:data-raw-date="${topic.postedDate}"></p>
                        ·
                        <div class="topic-stat-row">
                          <img src="/icons/heart.png" alt="Heart" title="Likes" width="20px">
                          <p class="js-format-num" th:data-raw-num="${topic.likesCount}"></p>
                        </div>
                        <div class="topic-stat-row">
                          <img src="/icons/chat.png" alt="Chat bubble" title="Reply" width="20px">
                          <p class="js-format-num" th:data-raw-num="${topic.replyCount}"></p>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="topic-options" th:data-topic-id="${topic.topicId}">
                    <button class="icon-button topic-options-btn">
                      <img src="/icons/options-row.png" width="16px">
                    </button>
                    <div class="topic-options-popup hidden">
                      <div class="topic-options-item">
                        <button class="icon-button-text delete-topic-option">
                          <img src="/icons/delete-top.png" width="16px">
                          <p>Delete</p>
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="divider"></div>
                  <div class="topic-last-post">
                    <div class="last-post-details" th:if="${topic.latestPostData != null}">
                      <a th:href="${topic.latestPostData.authorProfileUrl}"
                        th:text="${topic.latestPostData.authorDisplayName}"></a>
                      <p th:if="${topic.latestPostData.postType == 'reply'}">
                        replied — <span class="js-format-date"
                          th:data-raw-date="${topic.latestPostData.postedDate}"></span>
                      </p>
                      <p th:if="${topic.latestPostData.postType == 'comment'}">
                        commented — <span class="js-format-date"
                          th:data-raw-date="${topic.latestPostData.postedDate}"></span>
                      </p>
                    </div>
                    <div class="author-avatar" th:if="${topic.latestPostData != null}">
                      <img th:src="'/' + ${topic.latestPostData.authorAvatarUrl}" width="40px">
                    </div>
                    <p th:if="${topic.latestPostData == null}">No latest post yet...</p>
                  </div>
                </li>
              </ul>
            </div>
            <p th:if="${#lists.isEmpty(data.topics)}">No posted texts available.</p>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    /**
     * Get formatted date, returning two strings in an array:
     * - minimal date; e.g., "Today 10:57" or "Yesterday 10:57" or "2026 Jul 28"
     * - full date; "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      const now = new Date()
      const isToday = now.getDate() == datePosted.getDate()
      const isYesterday = now.getDate() - 1 == datePosted.getDate()

      const fullFormat = `${year} ${monthName} ${day} ${hours}:${minutes}`
      const simpleFullFormat = `${year} ${monthName} ${day}`

      if (isToday) {
        return [`Today ${hours}:${minutes}`, fullFormat]
      } else if (isYesterday) {
        return [`Yesterday ${hours}:${minutes}`, fullFormat]
      } else {
        return [simpleFullFormat, fullFormat]
      }
    }

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        const [minimalDate, fullDate] = getFormattedDate(rawDate)
        $(this).text(minimalDate)
        $(this).prop('title', fullDate)
      })

      $(".js-format-num").each(function () {
        const rawNum = $(this).attr('data-raw-num')
        const formatted = formatBigNumbers(rawNum)
        const dotted = rawNum.toLocaleString('en-US')
        $(this).text(formatted)
        $(this).prop('title', dotted)
      })

      $(".topic-options-btn").on("click", function (event) {
        event.stopPropagation();

        const item = $(this).closest(".post-list-item");
        const popup = $(this).siblings(".topic-options-popup");
        const isOpen = !popup.hasClass("hidden");

        $(".topic-options-popup").addClass("hidden");
        $(".post-list-item").removeClass("menu-open");

        if (!isOpen) {
          popup.removeClass("hidden");
          item.addClass("menu-open");
        }
      });

      $(document).on("click", function (event) {
        if (!$(event.target).closest(".topic-options").length) {
          $(".topic-options-popup").addClass("hidden");
          $(".post-list-item").removeClass("menu-open");
        }
      });

      $(".delete-topic-option").click(function () {
        const topicId = $(this).parent().parent().parent().attr("data-topic-id")

        fetch(`${window.location.href}/delete`, {
          method: "POST",
          body: topicId
        })
          .then(response => {
            if (response.ok) {
              location.reload();
            } else {
              if (response.status == "403") {
                Toast.error("Not logged in", "You must be logged in to perform this action", 5)
              } else {
                console.error("Delete failed");
              }
            }
          })
          .catch(console.error);
      })
    })

    // format number > 1000 to K or M
    // e.g., 123 -> 123, 1230 -> 1.2K
    function formatBigNumbers(num) {
      if (num >= 1_000_000_000) return "1B+";
      if (num >= 1_000_000) return `${+(num / 1_000_000).toFixed(0)}M`;
      if (num >= 10_000) return `${+(num / 10_000).toFixed(1)}K`;
      if (num >= 1_000) return `${+(num / 1_000).toFixed(1)}K`;
      return num;
    }
  </script>
</body>

</html>
