<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Edit Profile</title>
  <th:block th:replace="~{fragments/topbar :: topbar-styles}"></th:block>
  <style>
    .content {
      padding: 0;
      display: flex;
    }

    .profile-left {
      width: 200px;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
      border-right: 1px solid #ccc;
    }

    .avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 4px;
      border-bottom: 1px solid #ccc;
    }

    .avatar-container p {
      font-size: 14px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border: 1px solid #ccc;
    }

    .avatar img {
      padding: 4px;
    }

    .bias-container {
      position: relative;
      display: flex;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid #ccc;
      flex-direction: column;
    }

    .full-width {
      width: 100%;
    }

    .bias-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .bias-item {
      width: fit-content;
      padding: 4px;
      background-color: #fbf4ff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .bias-list-action {
      text-align: end;
    }

    .bias-checkbox-selector {
      width: 150px;
      position: absolute;
      top: -1;
      right: 0;
      transform: translateX(100%);
      background-color: #fff;
      border: 1px solid #ccc;
      z-index: 100;
    }

    .checkbox-title {
      padding: 4px;
      font-size: 16px;
      background-color: #f2f2f2;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border-top: 1px solid #ccc;
    }

    .checkbox-footer {
      padding: 4px;
      border-top: 1px solid #ccc;
      text-align: end;
    }

    .badge-list {
      max-height: 250px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid #ccc;
    }

    .badge-item {
      width: 20px;
      height: 20px;
      background-color: #ccc;
    }

    .profile-right {
      flex: 1;
      padding-bottom: 20px;
    }

    .profile-info {
      padding: 8px;
      line-height: 2;
      border-bottom: 1px solid #ccc;
    }

    .bio-box {
      width: 300px;
      min-height: 200px;
      color: #565656;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px;
    }

    .profile-actions {
      display: flex;
      justify-content: end;
      gap: 8px;
      margin-top: 16px;
    }

    .save-changes-btn {
      width: max-content;
      padding: 2px 4px;
      border-radius: 4px;
      background: linear-gradient(to bottom, #c19be3, #af87d7);
      color: #000;
      border: 1px solid #9b6bc8;
      text-shadow: 0 1px rgba(255, 255, 255, 0.35);
      box-shadow:
        rgba(0, 0, 0, 0.08) 0 6px 24px,
        inset 0 1px rgba(255, 255, 255, 0.25);
    }

    .save-changes-btn:hover {
      cursor: pointer;
      background: linear-gradient(to bottom, #caa7e8, #b78ddd);
    }

    .save-changes-btn:active {
      background-image: linear-gradient(to top, #c19be3, #af87d7);
      box-shadow: inset 1px 1px 1px rgba(0, 0, 0, 0.1);
    }

    .user-contents {
      padding: 8px
    }

    .hidden {
      display: none;
    }
  </style>
</head>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    $(document).ready(function () {
      $("#edit-bias-btn").click(function (event) {
        event.stopPropagation();
        initializeBiasCheckbox()
        $(".bias-checkbox-selector").removeClass("hidden");
      });

      $(".bias-checkbox-selector").click(function (event) {
        event.stopPropagation();
      });

      $(document).click(function (event) {
        const clickedInsideSelector =
          $(event.target).closest(".bias-checkbox-selector").length;

        const clickedEditButton =
          $(event.target).closest("#edit-bias-btn").length;

        if (!clickedInsideSelector && !clickedEditButton) {
          $(".bias-checkbox-selector").addClass("hidden");
        }
      });

      $(".checkbox-cancel").click(function () {
        $(".bias-checkbox-selector").addClass("hidden");
      });

      $(".checkbox-submit").click(function () {
        const biasList = getCheckedBias();
        $(".bias-checkbox-selector").addClass("hidden");
        updateBiasList(biasList)
      });
    })

    function getCurrentBiasList() {
      const l = []
      $(".bias-list").children().each(function () {
        l.push($(this).attr("data-member-name"))
      })
      return l
    }

    function initializeBiasCheckbox() {
      const biasList = getCurrentBiasList()
      $(".checkbox-list").children().each(function () {
        const checkbox = $(this).children(`input[type="checkbox"]`)
        if (biasList.includes(checkbox.attr("id"))) {
          checkbox.prop("checked", true)
        } else {
          checkbox.prop("checked", false)
        }
      })
    }

    function getCheckedBias() {
      const biasList = []
      $(".checkbox-list").children().each(function () {
        const member = $(this).children(`input[type="checkbox"]:checked`).attr("id")
        if (member) biasList.push(member)
      })
      return biasList
    }

    function updateBiasList(newBiases) {
      $(".bias-list").empty()
      for (const bias of newBiases.sort((a, b) => a.localeCompare(b))) {
        $(".bias-list").append(
          $("<div></div>").addClass("bias-item").attr("data-member-name", bias).append($("<p></p>").text(bias))
        )
      }
    }
  </script>
