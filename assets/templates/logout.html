<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Logout</title>
  <th:block th:replace="~{fragments/topbar :: topbar-styles}"></th:block>
  <style>
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <h1>Logout</h1>
            <p th:if="${data.account}">You are going to log out, are you sure?</p>
            <p th:if="${not data.account}">You are no longer logged in.</p>
            <a id="logout-link" class="link" href="#" th:if="${data.account}">Log me out</a>
            <div style="margin-top:10px;"></div>
            <a class="link" href="/">Back to lobby</a>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    $("#logout-link").click(function () {
      event.preventDefault()

      fetch("/api/logout", { method: "POST" })
        .then(response => {
          if (response.ok) {
            location.reload();
          } else {
            console.error("Delete failed");
          }
        })
        .catch(console.error);
    })
  </script>
</body>

</html>
