<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Cafe.Home</title>
  <th:block th:replace="~{fragments/topbar :: topbar-styles}"></th:block>
  <style>
    li {
      padding-left: 0;
    }

    .content {
      padding-top: 8px;
    }

    .space-lists {
      width: 650px;
      display: flex;
      flex-direction: column;
    }

    .space-item {}

    .space-name-row {
      padding: 2px;
      padding-left: 8px;
      color: white;
      background: var(--primary-gradient);
      border: 1px solid var(--primary-gradient-end);
      font-size: 14px;
      font-weight: bold;
    }

    .section-lists {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .section-item {
      display: grid;
      grid-template-columns: 370px 11px 262px;
      align-items: center;
      padding: 6px 4px;
      background: linear-gradient(to bottom, rgb(255, 255, 255), #eee);
    }

    .section-item:not(:last-child) {
      border-bottom: 1px solid var(--border-color);
    }

    .section-details {
      padding-left: 12px;
    }

    .section-name {
      color: var(--muted-blue-500);
      font-size: 14px;
      font-weight: bold;
    }

    .section-name:hover {
      color: var(--muted-blue-400);
    }

    .section-description {
      color: black;
      font-size: 12px;
    }

    .divider {
      width: 2px;
      height: 100%;
      background-color: var(--sea-blue-600);
    }

    .section-last-post {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 4px;
    }

    .last-post-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .last-post-title {
      width: max-content;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--sea-blue-600);
      font-weight: bold;
    }

    .last-post-author-details {
      max-width: 200px;
    }

    .last-post-author-name {
      color: var(--sea-blue-500);
    }

    .author-avatar {
      border: 1px solid #ccc;
    }

    .author-avatar img {
      padding: 1px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <ul class="space-lists" th:if="${not #lists.isEmpty(data.spaces)}">
              <li class="space-item" th:each="space : ${data.spaces}">
                <div>
                  <p class="space-name-row" th:text="${space.name}"></p>
                  <ul class="section-lists">
                    <li class="section-item" th:each="section : ${space.sections}">
                      <div class="section-details">
                        <p>
                          <a th:href="'cafe/' + ${section.id}" class="section-name" th:text="${section.name}"></a>
                          <span th:inline="text">([[${section.topicCounts}]] posts)</span>
                        </p>
                        <p class="section-description" th:text="${section.description}"></p>
                      </div>
                      <div class="divider"></div>
                      <div class="section-last-post">
                        <div class="last-post-details" th:if="${section.latestPostData != null}">
                          <a class="last-post-title" th:href="${section.latestPostData.topicUrl}"
                            th:text="${section.latestPostData.topicTitle}"></a>
                          <p class="last-post-author-details" th:if="${section.latestPostData.postType == 'topic'}">
                            <a class="last-post-author-name" th:href="${section.latestPostData.authorProfileUrl}"
                              th:text="${section.latestPostData.authorDisplayName}"></a>
                            wrote — <span class="js-format-date"
                              th:data-raw-date="${section.latestPostData.postedDate}"></span>
                          </p>
                          <p class="last-post-author-details" th:if="${section.latestPostData.postType == 'reply'}">
                            <a class="last-post-author-name" th:href="${section.latestPostData.authorProfileUrl}"
                              th:text="${section.latestPostData.authorDisplayName}"></a>
                            replied — <span class="js-format-date"
                              th:data-raw-date="${section.latestPostData.postedDate}"></span>
                          </p>
                        </div>
                        <div class="author-avatar" th:if="${section.latestPostData != null}">
                          <img th:src="'/' + ${section.latestPostData.authorAvatarUrl}" width="40px">
                        </div>
                        <p th:if="${section.latestPostData == null}">No latest post yet...</p>
                      </div>
                    </li>
                  </ul>
                </div>
              </li>
            </ul>
            <p th:if="${#lists.isEmpty(data.spaces)}">No spaces have been made yet ㅠㅠ</p>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    /**
     * Get formatted date, returning two strings in an array:
     * - minimal date; e.g., "Today 10:57" or "Yesterday 10:57" or "2026 Jul 28"
     * - full date; "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      const now = new Date()
      const isToday = now.getDate() == datePosted.getDate()
      const isYesterday = now.getDate() - 1 == datePosted.getDate()

      const fullFormat = `${year} ${monthName} ${day} ${hours}:${minutes}`
      const simpleFullFormat = `${year} ${monthName} ${day}`

      if (isToday) {
        return [`Today ${hours}:${minutes}`, fullFormat]
      } else if (isYesterday) {
        return [`Yesterday ${hours}:${minutes}`, fullFormat]
      } else {
        return [simpleFullFormat, fullFormat]
      }
    }

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        const [minimalDate, fullDate] = getFormattedDate(rawDate)
        $(this).text(minimalDate)
        $(this).prop('title', fullDate)
      })
    })
  </script>
</body>

</html>
