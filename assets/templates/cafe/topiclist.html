<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Cafe.TopicList</title>
  <th:block th:replace="~{fragments/topbar :: topbar-styles}"></th:block>
  <style>
    .content {
      padding-left: 0;
      padding-top: 4px;
    }

    .back-link {
      padding-left: 4px;
    }

    .topic-lists-container {
      padding: 8px;
    }

    .topic-lists-header {
      padding: 4px 0px;
      color: white;
      background: var(--primary-gradient);
    }

    .section-title {
      padding-left: 8px;
      font-size: 18px;
    }

    .cafe-actions {
      display: flex;
      align-items: center;
      padding: 4px;
      padding-left: 2px;
      background: linear-gradient(to bottom, white, #eaf5ff);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    .topic-lists {}

    .post-list-item {
      display: grid;
      grid-template-columns: 440px 42px 200px;
      padding: 4px 0px;
      background: var(--white-to-gray-gradient);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      line-height: 1.3;
    }

    .topic-details {
      display: flex;
      align-items: center;
      padding-left: 4px;
      gap: 4px;
    }

    .author-avatar {
      border: 1px solid #ccc;
    }

    .author-avatar img {
      padding: 1px;
    }

    .topic-title-column {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .topic-title {
      width: max-content;
      color: var(--sea-blue-600);
      font-size: 14px;
      font-weight: bold;
    }

    .topic-title:hover {
      color: var(--sea-blue-550);
    }

    .topic-author-name {
      color: var(--sea-blue-500);
    }

    .topic-stats {
      padding-right: 8px;
    }

    .topic-stat-row {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: 4px;
    }

    .topic-last-post {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 4px;
      padding-left: 4px;
      border-left: 2px solid var(--muted-blue-500);
    }

    .last-post-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <a class="link back-link" href="/cafe">← Back to Cafe</a>
            <div class="topic-lists-container">
              <div class="topic-lists-header">
                <p class="section-title" th:text="${#strings.capitalize(data.sectionName)}"></p>
              </div>
              <div class="cafe-actions">
                <a class="icon-link" th:href="${data.sectionId} + '/write'">
                  <img src="/icons/pencil.png" width="24px" alt="House">
                  <p>Write a topic</p>
                </a>
              </div>
              <ul class="topic-lists" th:if="${not #lists.isEmpty(data.topics)}">
                <li class="post-list-item" th:each="topic : ${data.topics}">
                  <div class="topic-details">
                    <div class="author-avatar">
                      <img th:src="'/' + ${topic.authorAvatarUrl}" width="40px">
                    </div>
                    <div class="topic-title-column">
                      <a class="topic-title" th:href="${topic.link}" th:text="${topic.title}"></a>
                      <p>
                        Posted by <a class="topic-author-name" th:text="${topic.authorName}"
                          th:href="${topic.authorProfileUrl}"></a>,
                        <span class="topic-posted-date js-format-date" th:data-raw-date="${topic.postedDate}"></span>
                      </p>
                    </div>
                  </div>
                  <div class="topic-stats">
                    <span class="topic-stat-row">
                      <img src="/icons/chat.png" alt="Chat bubble" title="Reply" width="20px">
                      <p th:text="${topic.replyCount}"></p>
                    </span>
                    <span class="topic-stat-row">
                      <img src="/icons/heart.png" alt="Heart" title="Likes" width="20px">
                      <p th:text="${topic.likesCount}"></p>
                    </span>
                  </div>
                  <div class="topic-last-post">
                    <div class="last-post-details">
                      <p>Last post by ...</p>
                      <p>2026 Oct 21 03:40</p>
                    </div>
                    <div class="author-avatar">
                      <img th:src="'/' + ${topic.authorAvatarUrl}" width="40px">
                    </div>
                  </div>
                </li>
              </ul>
            </div>
            <p th:if="${#lists.isEmpty(data.topics)}">No posted texts available.</p>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    /**
     * Get formatted date, returning two strings in an array:
     * - minimal date; e.g., "Today 10:57" or "Yesterday 10:57" or "2026 Jul 28"
     * - full date; "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      const now = new Date()
      const isToday = now.getDate() == datePosted.getDate()
      const isYesterday = now.getDate() - 1 == datePosted.getDate()

      const fullFormat = `${year} ${monthName} ${day} ${hours}:${minutes}`
      const simpleFullFormat = `${year} ${monthName} ${day}`

      if (isToday) {
        return [`Today ${hours}:${minutes}`, fullFormat]
      } else if (isYesterday) {
        return [`Yesterday ${hours}:${minutes}`, fullFormat]
      } else {
        return [simpleFullFormat, fullFormat]
      }
    }

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        const [minimalDate, fullDate] = getFormattedDate(rawDate)
        $(this).text(minimalDate)
        $(this).prop('title', fullDate)
      })

      $(document).on("click", ".delete-post", function (event) {
        event.preventDefault()
        const topicId = $(this).attr('data-topic-id')

        fetch(`${window.location.href}/delete`, {
          method: "POST",
          body: topicId
        })
          .then(response => {
            if (response.ok) {
              location.reload();
            } else {
              if (response.status == "403") {
                Toast.error("Not logged in", "You must be logged in to perform this action", 5)
              } else {
                console.error("Delete failed");
              }
            }
          })
          .catch(console.error);
      })
    })
  </script>
</body>

</html>
