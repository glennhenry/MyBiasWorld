<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="topbar-styles">
  <style>
    .topbar {
      width: calc(var(--site-width) - var(--sidebar-width));
      height: var(--topbar-height);
      position: sticky;
      top: 0;
      display: flex;
      border-bottom: 1px solid var(--border-color);
      z-index: var(--topbar-zindex);
      background-color: white;
      font-size: 14px;
    }

    .topbar-grid {
      display: grid;
      grid-template-columns: 700px 200px;
      grid-template-rows: 45px 35px;
      grid-template-areas:
        "links   account"
        "notices search ";
      flex: 1;
    }

    .links {
      grid-area: links;
      padding: 0px 8px;
    }

    .top-links {
      display: flex;
      gap: 50px;
    }

    .icon-link {
      display: flex;
      align-items: center;
      gap: 2px;
      color: #2d72ad;
      text-decoration: underline;
    }

    .icon-link:hover {
      text-decoration-thickness: 2px;
    }

    .down-arrow {
      margin-left: 2px;
    }

    .dropdown-link {
      position: relative;
      display: flex;
    }

    .dropdown-link-items {
      min-width: max-content;
      position: absolute;
      top: 100%;
      left: 0;
      display: none;
      flex-direction: column;
      gap: 2px;
      border: 1px solid #ccc;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .dropdown-link:hover .dropdown-link-items {
      display: flex;
    }

    .dropdown-link-item {
      display: flex;
      align-items: center;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .dropdown-link-item:not(:last-child) {
      border-bottom: 1px solid #ccc;
    }

    .bottom-links {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .account-info {
      grid-area: account;
      display: flex;
      padding: 0px 8px;
      justify-content: end;
      text-align: end;
    }

    .account-info-col {
      display: flex;
      flex-direction: column;
    }

    .notices {
      grid-area: notices;
      justify-content: end;
      display: flex;
      padding: 0px 8px;
      margin-right: -32px;
      align-items: center;
    }

    .notices-link {
      display: flex;
      gap: 40px;
      margin-right: 40px;
    }

    .server-time-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .search {
      grid-area: search;
      display: flex;
      gap: 4px;
      justify-content: end;
      padding: 0px 8px;
      align-items: center;
    }

    .search-input {
      all: unset;
      width: 120px;
      height: 25px;
      border: 1px solid #ccc;
      padding-left: 4px;
      font-size: 12px;
    }

    .search-action {
      background-color: #dcdcdc;
      padding: 5px;
    }
  </style>
</head>

<body>
  <header class="topbar" th:fragment="topbar (account)">
    <div class="topbar-grid">
      <div class="links">
        <nav class="top-links">
          <a class="icon-link" href="javascript:void(0)">
            <img src="/icons/house.png" width="16px" alt="House">

          </a>
          <div class="dropdown-link" href="javascript:void(0)">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/coffee.png" width="20px" alt="Coffee">
              <p>Cafe</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/calculator.png" width="20px" alt="Calculator">
                <p>Icon link placeholder</p>
              </a>
              <a class="dropdown-link-item link" href="javascript:void(0)">
                <p>Link placeholder</p>
              </a>
            </div>
          </div>
          <div class="dropdown-link" href="javascript:void(0)">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/book.png" width="20px" alt="Book">
              <p>Wiki</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/calculator.png" width="20px" alt="Calculator">
                <p>Icon link placeholder</p>
              </a>
              <a class="dropdown-link-item link" href="javascript:void(0)">
                <p>Link placeholder</p>
              </a>
            </div>
          </div>
          <div class="dropdown-link" href="javascript:void(0)">
            <a class="icon-link" href="javascript:void(0)">
              <img style="margin-right:-4px;" src="/icons/dice.png" width="24px" alt="Dice">
              <p>Games</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/calculator.png" width="20px" alt="Calculator">
                <p>Icon link placeholder</p>
              </a>
              <a class="dropdown-link-item link" href="javascript:void(0)">
                <p>Link placeholder</p>
              </a>
            </div>
          </div>
          <div class="dropdown-link" href="javascript:void(0)">
            <a class="icon-link" href="javascript:void(0)">
              <img src="/icons/tool.png" width="20px" alt="Tools">
              <p>Tools & Services</p>
              <img class="down-arrow" src="/icons/down-arrow.png" width="8px">
            </a>
            <div class="dropdown-link-items hidden">
              <a class="dropdown-link-item icon-link" href="javascript:void(0)">
                <img src="/icons/calculator.png" width="20px" alt="Calculator">
                <p>Icon link placeholder</p>
              </a>
              <a class="dropdown-link-item link" href="javascript:void(0)">
                <p>Link placeholder</p>
              </a>
            </div>
          </div>
        </nav>
        <nav class="bottom-links">
          <a class="icon-link" href="javascript:void(0)">
            <img src="/icons/shop.png" width="20px" alt="Shop">
            <p>Shop</p>
          </a>
          <a class="icon-link" href="javascript:void(0)">
            <img src="/icons/board.png" width="20px" alt="Board">
            <p>Board</p>
          </a>
        </nav>
      </div>
      <div class="account-info">
        <div class="account-info-col" th:if="${account != null}">
          <p>Hello, <u th:text="${account.username}"></u></p>
          <a class="link" href="/logout">Logout</a>
        </div>
        <div class="account-info-col" th:if="${account == null}">
          <a class="link" href="/register">Register</a>
          <a class="link" href="/login">Login</a>
        </div>
      </div>
      <div class="notices">
        <div class="notices-link">
          <a class="link" href="javascript:void(0)">Help</a>
        </div>
        <div class="server-time-row">
          <p class="server-time">Time: 12:10</p>
          <img src="/icons/clock-black.png" width="22px">
        </div>
      </div>
      <div class="search">
        <input class="search-input" type="text" placeholder="Search">
        <a class="search-action" href="javascript:void(0)">
          <img src="icons/search.png" width="16" alt="Search">
        </a>
      </div>
    </div>
  </header>
  <script th:fragment="topbar-scripts">
    $(document).ready(function () {

    })
  </script>
</body>

</html>
