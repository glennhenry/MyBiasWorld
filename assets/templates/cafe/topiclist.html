<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Cafe.TopicList</title>
  <style>
    .topic-lists {
      display: flex;
      flex-direction: column;
    }

    .posted-text {
      width: 500px;
    }

    .post-list-item {
      border: 1px solid black;
      list-style: none;
      padding: 4px;
      line-height: 1.3;
    }

    .post-list-item+.post-list-item {
      border-top: none;
    }

    .topic-title-row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    .topic-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #704984;
    }

    .topic-title:hover {
      color: #ad7ec5
    }

    .topic-author-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding-bottom: 4px;
      font-size: 14px;
    }

    .topic-author-left {
      flex-grow: 1;
    }

    .topic-author-name {
      font-style: italic;
      flex: 1;
    }

    .reply-likes-column {
      text-align: end;
    }

    .topic-stat-row {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: 4px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <a class="link" href="/cafe">← Back to Cafe</a>
            <h1 th:text="${#strings.capitalize(data.sectionId)}"></h1>
            <hr>
            <div class="posted-text">
              <div class="space-y-s"></div>
              <a class="link" th:href="${data.sectionId} + '/write'">Write a topic</a>
              <div class="space-y-xs"></div>
              <ul class="topic-lists" th:if="${not #lists.isEmpty(data.topics)}">
                <li class="post-list-item" th:each="topic : ${data.topics}">
                  <div>
                    <div class="topic-title-row">
                      <a class="topic-title" th:href="${topic.link}" th:text="${topic.title}"></a>
                      <a class="delete-post" href="#" title="Delete post" th:data-topic-id="${topic.topicId}">
                        <img src="/icons/delete.png" alt="delete" width="16">
                      </a>
                    </div>
                    <div class="topic-author-row">
                      <div>
                        <span class="topic-author-left">
                          Posted by <span class="topic-author-name" th:text="${topic.authorName}"></span>
                        </span>
                        <p class="topic-posted-date js-format-date" th:data-raw-date="${topic.postedDate}"></p>
                      </div>
                      <div class="reply-likes-column">
                        <span class="topic-stat-row">
                          <img src="/icons/chat.png" alt="Chat bubble" title="Reply" width="20px">
                          <p th:text="${topic.replyCount}"></p>
                        </span>
                        <span class="topic-stat-row">
                          <img src="/icons/heart.png" alt="Heart" title="Likes" width="20px">
                          <p th:text="${topic.likesCount}"></p>
                        </span>
                      </div>
                    </div>
                  </div>
                </li>
              </ul>
              <p th:if="${#lists.isEmpty(data.topics)}">No posted texts available.</p>
            </div>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    /**
     * Get formatted date, returning two strings in an array:
     * - minimal date; e.g., "Today 10:57" or "Yesterday 10:57" or "2026 Jul 28 10:57"
     * - full date; "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      const now = new Date()
      const isToday = now.getDate() == datePosted.getDate()
      const isYesterday = now.getDate() - 1 == datePosted.getDate()

      const fullFormat = `${year} ${monthName} ${day} ${hours}:${minutes}`

      if (isToday) {
        return [`Today ${hours}:${minutes}`, fullFormat]
      } else if (isYesterday) {
        return [`Yesterday ${hours}:${minutes}`, fullFormat]
      } else {
        return [fullFormat, fullFormat]
      }
    }

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        const [minimalDate, fullDate] = getFormattedDate(rawDate)
        $(this).text(minimalDate)
        $(this).prop('title', fullDate)
      })

      $(document).on("click", ".delete-post", function (event) {
        event.preventDefault()
        const topicId = $(this).attr('data-topic-id')

        fetch("/cafe/delete", {
          method: "POST",
          body: topicId
        })
          .then(response => {
            if (response.ok) {
              location.reload();
            } else {
              if (response.status == "403") {
                Toast.error("Not logged in", "You must be logged in to perform this action", 5)
              } else {
                console.error("Delete failed");
              }
            }
          })
          .catch(console.error);
      })
    })
  </script>
</body>

</html>
