<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Cafe.TopicView</title>
  <style>
    textarea {
      all: unset;
    }

    .content {
      padding-left: 0;
    }

    .backlink {
      padding: 4px;
    }

    .post-header {
      display: flex;
      flex-direction: column;
    }

    .post-title {
      font-size: 16px;
      padding: 8px;
      border-top: 1px solid #ccc;
    }

    .post {
      display: flex;
      border-top: 1px solid #ccc;
    }

    .post:last-child {
      border-bottom: 1px solid #ccc;
    }

    .author-profile {
      width: 150px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
    }

    .avatar-container {
      padding: 24px;
      padding-bottom: 12px;
      display: flex;
      justify-content: center;
    }

    .avatar {
      border: 1px solid #ccc;
    }

    .author-info-container {
      font-size: 12px;
      padding-bottom: 24px;
    }

    .author-name {
      text-align: center;
      font-weight: bold;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      overflow-wrap: anywhere;
      word-break: normal;
      overflow: hidden;
    }

    .post-layout {
      flex: 1;
    }

    .post-content-container:hover .post-context-actions {
      opacity: 1;
    }

    .post-content {
      min-height: 120px;
      padding: 8px;
    }

    .post-footer {
      display: flex;
      flex-direction: row;
      align-items: end;
      padding: 8px;
      margin-top: 32px;
    }

    .post-context-actions {
      display: flex;
      flex: 1;
      gap: 4px;
      opacity: 0;
    }

    .post-info {
      text-align: end;
    }

    .comment-info-row {
      display: flex;
      justify-content: end;
      gap: 4px;
    }

    .comment-layout {
      display: flex;
      flex-direction: column;
      background: var(--site-bg-color);
      border-top: 1px solid #ccc;
    }

    .comment {
      display: flex;
      flex-direction: row;
      gap: 4px;
      padding: 12px;
      padding-left: 16px;
      border-bottom: 1px solid #ccc;
    }

    .comment:hover .comment-context-actions {
      opacity: 1;
    }

    .comment-author-avatar {
      height: max-content;
      padding: 1px;
      border: 1px solid #b3b3b3;
    }

    .comment-author-name-container {
      width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .comment-author-name {
      font-weight: bold;
      color: #975396;
      font-size: 12px;
    }

    .comment-posted-date {
      font-size: 12px;
      color: #6c6c6c;
    }

    .comment-content-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-content {
      flex: 1;
    }

    .comment-context-actions {
      display: flex;
      flex-direction: row;
      justify-content: end;
      gap: 4px;
      opacity: 0;
    }

    .comment-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      gap: 8px;
      padding: 16px;
    }

    .comment-textarea {
      height: 50px;
      border: 1px solid #ccc;
      padding: 4px;
      padding-right: 16px;
      overflow-wrap: break-word;
      overflow-y: auto;
      resize: none;
      cursor: text;
    }

    .comment-publish-btn {
      align-self: end;
    }

    #comment-status {
      color: red;
      align-self: end;
    }

    .topic-reply-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px;
    }

    .topic-reply-box {
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #topic-reply-textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 200px;
      max-height: 400px;
      padding-right: 12px;
      overflow-x: hidden;
      overflow-y: hidden;
      overflow-wrap: break-word;
      resize: none;
      cursor: text;
    }

    .counter-publish-row {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: 8px;
    }

    #topic-reply-publish-btn {
      width: fit-content;
      align-self: end;
    }

    #topic-reply-status {
      color: red;
      align-self: end;
    }

    .hidden {
      display: none;
    }

    .insufficient {
      color: red;
    }

    .sufficient {
      color: green;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div class="post-header">
              <a class="link backlink" th:text="'← Back to ' + ${#strings.capitalize(data.sectionName)}"></a>
              <h1 class="post-title" th:text="${data.topic.title}"></h1>
            </div>
            <div class="posts-list">

              <!-- Main topic -->
              <div class="post">
                <div class="author-profile">
                  <div class="avatar-container">
                    <img class="avatar" style="padding: 4px;" th:src="'/' + ${data.topic.authorAvatarUrl}"
                      alt="profile avatar" width="100">
                  </div>
                  <div class="author-info-container">
                    <p class="author-name" th:text="${data.topic.authorDisplayName}"></p>
                  </div>
                </div>
                <div class="post-layout">
                  <div class="post-content-container">
                    <p class="post-content" th:text="${data.topic.content}"></p>
                    <div class="post-footer">
                      <div class="post-context-actions">
                        <a href="javascript:void(0);" title="Report this post">
                          <img src="/icons/danger.png" alt="Danger sign" width="24px">
                        </a>
                        <a href="javascript:void(0);" title="Share">
                          <img src="/icons/share.png" alt="Blue arrow pointing right" width="24px">
                        </a>
                      </div>
                      <div class="post-info">
                        <span class="js-format-date" th:data-raw-date="${data.topic.postedDate}">
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Replies -->
              <div class="post" th:each="reply: ${data.replies}">
                <div class="author-profile">
                  <div class="avatar-container">
                    <img class="avatar" style="padding: 4px;" th:src="'/' + ${reply.authorAvatarUrl}"
                      alt="profile avatar" width="100">
                  </div>
                  <div class="author-info-container">
                    <p class="author-name" th:text="${reply.authorDisplayName}"></p>
                  </div>
                </div>
                <div class="post-layout">
                  <div class="post-content-container">
                    <p class="post-content" th:text="${reply.content}"></p>
                    <div class="post-footer">
                      <div class="post-context-actions">
                        <a href="javascript:void(0);" title="Report this post">
                          <img src="/icons/danger.png" alt="Danger sign" width="24px">
                        </a>
                        <a href="javascript:void(0);" title="Share">
                          <img src="/icons/share.png" alt="Blue arrow pointing right" width="24px">
                        </a>
                      </div>
                      <div class="post-info">
                        <div class="comment-info-row">
                          <a class="link see-comment" href="javascript:void(0)"
                            th:text="${#lists.isEmpty(reply.comments) ? 'See comments' : 'Collapse'}"
                            th:data-comment-id="${reply.replyId}"></a>
                          <p th:text="'(' + ${#lists.size(reply.comments)} + ')'"></p>
                          <a class="comment-icon" href="javascript:void(0)" title="Add a comment"
                            th:data-comment-form-id="${reply.replyId}">
                            <img src="/icons/chat.png" alt="Chat bubble" width="24">
                          </a>
                        </div>
                        <span class="js-format-date" th:data-raw-date="${reply.postedDate}"></span>
                      </div>
                    </div>
                  </div>

                  <!-- Comments -->
                  <div class="comment-layout" th:classappend="${#lists.isEmpty(reply.comments)} ? 'hidden'"
                    th:data-comment-id="${reply.replyId}">
                    <div class="comment" th:each="comment: ${reply.comments}">
                      <img class="comment-author-avatar" th:src="'/' + ${comment.authorAvatarUrl}" width="40px">
                      <div class="comment-author-name-container">
                        <a class="comment-author-name" href="javascript:void(0)"
                          th:text="${comment.authorDisplayName}"></a>
                        <p class="js-format-date comment-posted-date" th:data-raw-date="${comment.postedDate}"></p>
                      </div>
                      <div class="comment-content-container">
                        <p class="comment-content" th:text="${comment.content}"></p>
                        <div class="comment-context-actions">
                          <a href="javascript:void(0)" title="Report this comment">
                            <img src="/icons/danger.png" alt="Danger sign" width="20px">
                          </a>
                        </div>
                      </div>
                    </div>

                    <!-- Comment to a reply -->
                    <div class="comment-form">
                      <textarea class="comment-textarea" placeholder="Write a reply..."
                        th:data-comment-form-id="${reply.replyId}"></textarea>
                      <div class="counter-publish-row" th:if="${data.account != null}">
                        <p id="comment-counter" th:data-comment-form-id="${reply.replyId}"></p>
                        <button class="comment-publish-btn" th:data-comment-form-id="${reply.replyId}">Publish</button>
                      </div>
                      <p id="comment-status" th:data-comment-form-id="${reply.replyId}"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Reply to the topic -->
            <div class="topic-reply-section">
              <div class="topic-reply-box">
                <textarea id="topic-reply-textarea" placeholder="Write your reply here..."
                  th:if="${data.account != null}"></textarea>
                <p th:if="${data.account == null}">You need to <a id="register" class="link"
                    href="/register">register</a>
                  or <a id="login" class="link" href="/login">login</a> before posting a
                  reply.</p>
              </div>
              <div class="counter-publish-row" th:if="${data.account != null}">
                <p id="reply-counter"></p>
                <button id="topic-reply-publish-btn">Publish</button>
              </div>
              <p id="topic-reply-status" th:if="${data.account != null}"></p>
            </div>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    const replyMinLength = 20
    const replyMaxLength = 1000
    const replyTextarea = $("#topic-reply-textarea")
    const replyCounter = $("#reply-counter")

    const commentMinLength = 10
    const commentMaxLength = 300

    $(document).ready(function () {
      $(".js-format-date").each(function () {
        const rawDate = $(this).attr('data-raw-date')
        $(this).text(getFormattedDate(rawDate))
      })

      $(".backlink").attr('href', new URL('..', window.location.href).href.replace(/\/$/, ''))

      $("#register").attr('href', `/register?return=${window.location.pathname}`)
      $("#login").attr('href', `/login?return=${window.location.pathname}`)

      updateReplyCounter()
      resizeReplyTextarea()
      $("#topic-reply-textarea").on("input", function () {
        updateReplyCounter()
        resizeReplyTextarea()
      })

      $(".comment-textarea").each(function () {
        updateCommentCounter($(this))
      })
      $(".comment-textarea").on("input", function () {
        updateCommentCounter($(this))
      })
    })

    /**
     * Get formatted date, returning a string in format like "2026 Jul 28 10:57"
     */
    function getFormattedDate(millis) {
      const datePosted = new Date(Number(millis))

      const year = datePosted.getFullYear()
      const months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      const monthName = months[datePosted.getMonth()];
      const day = String(datePosted.getDate()).padStart(2, "0")

      const hours = String(datePosted.getHours()).padStart(2, "0");
      const minutes = String(datePosted.getMinutes()).padStart(2, "0");

      return `${year} ${monthName} ${day} ${hours}:${minutes}`
    }

    function updateReplyCounter() {
      const len = $("#topic-reply-textarea").val().length
      const valid = len >= replyMinLength && len <= replyMaxLength

      $("#reply-counter")
        .toggleClass("sufficient", valid)
        .toggleClass("insufficient", !valid)

      if (valid) {
        $("#reply-counter").text(`${len}/${replyMinLength}`)
      } else if (len < replyMinLength) {
        $("#reply-counter").text(`(min ${replyMinLength} characters) ${len}/${replyMinLength}`)
      } else {
        $("#reply-counter").text(`(max ${replyMaxLength} characters) ${len}/${replyMinLength}`)
      }

      if (valid) {
        $("#topic-reply-textarea").attr("data-input-status", "ok")
      } else if (len < replyMinLength) {
        $("#topic-reply-textarea").attr("data-input-status", "more")
      } else {
        $("#topic-reply-textarea").attr("data-input-status", "toomuch")
      }
    }

    function updateCommentCounter(commentTextarea) {
      const formId = commentTextarea.attr("data-comment-form-id")
      const len = commentTextarea.val().length
      const valid = len >= commentMinLength && len <= commentMaxLength
      const commentCounter = $(`#comment-counter[data-comment-form-id=${formId}]`)

      commentCounter
        .toggleClass("sufficient", valid)
        .toggleClass("insufficient", !valid)

      if (valid) {
        commentCounter.text(`${len}/${commentMinLength}`)
      } else if (len < commentMinLength) {
        commentCounter.text(`(min ${commentMinLength} characters) ${len}/${commentMinLength}`)
      } else {
        commentCounter.text(`(max ${commentMaxLength} characters) ${len}/${commentMinLength}`)
      }

      if (valid) {
        commentTextarea.attr("data-input-status", "ok")
      } else if (len < commentMinLength) {
        commentTextarea.attr("data-input-status", "more")
      } else {
        commentTextarea.attr("data-input-status", "toomuch")
      }
    }

    function resizeReplyTextarea() {
      if ($("#topic-reply-textarea").length > 0) {
        $("#topic-reply-textarea").height("0px")
        $("#topic-reply-textarea").height(Math.min($("#topic-reply-textarea")[0].scrollHeight, 400) + "px")

        if ($("#topic-reply-textarea")[0].scrollHeight > 400) {
          $("#topic-reply-textarea").css("overflow-y", "auto")
        } else {
          $("#topic-reply-textarea").css("overflow-y", "hidden")
        }
      }
    }

    $("#topic-reply-publish-btn").click(function (event) {
      replyListener(event)
    })

    // Show or hide comments
    $(".see-comment").each(function () {
      $(this).click(function () {
        const commentId = $(this).attr("data-comment-id")
        const el = $(`.comment-layout[data-comment-id="${commentId}"]`)
        el.toggleClass("hidden")
        if (el.hasClass("hidden")) {
          $(this).text("See comments")
        } else {
          $(this).text("Collapse")
        }
      })
    })

    // Enable focus and show comment textarea
    $(".comment-icon").each(function () {
      $(this).click(function () {
        const commentId = $(this).attr("data-comment-form-id")
        const textarea = $(`.comment-textarea[data-comment-form-id="${commentId}"]`)
        const commentSection = $(`.comment-layout[data-comment-id="${commentId}"]`)

        if (commentSection.hasClass("hidden")) {
          commentSection.toggleClass("hidden")
        }

        textarea.focus()
      })
    })

    $(".comment-publish-btn").click(function (event) {
      commentListener($(this).attr("data-comment-form-id"))
    })

    async function replyListener(event) {
      if (!checkReplyText()) return

      const replyText = $("#topic-reply-textarea").val();
      const payload = { reply: replyText }

      try {
        const response = await fetch(window.location.href, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          $("#topic-reply-textarea").val("")
          window.location.reload()
          return
        } else if (response.status == 400) {
          $("#topic-reply-status").text(await response.text())
        }

      } catch (err) {
        console.error("Reply error: ", err)
      }
    }

    function checkReplyText() {
      const replyTextareaStatus = $("#topic-reply-textarea").attr("data-input-status")
      if (replyTextareaStatus != "ok") {
        if (replyTextareaStatus == "more") {
          $("#topic-reply-status").text("Reply must be at least 20 characters.")
        } else if (replyTextareaStatus == "toomuch") {
          $("#topic-reply-status").text("Reply should not be more than 3000 characters.")
        }
        return false
      }

      $("#topic-reply-status").text("")
      return true
    }

    async function commentListener(commentFormId) {
      if (!checkCommentText(commentFormId)) return

      const commentText = $(`.comment-textarea[data-comment-form-id=${commentFormId}]`).val()
      const payload = { comment: commentText }

      try {
        // commentFormId is reply.replyId
        const response = await fetch(`${window.location.href}/${commentFormId}`, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          $(`.comment-textarea[data-comment-form-id=${commentFormId}]`).val("")
          window.location.reload()
          return
        } else if (response.status == 400) {
          $("#comment-status").text(await response.text())
        }

      } catch (err) {
        console.error("Comment error: ", err)
      }
    }

    function checkCommentText(commentFormId) {
      const commentTextareaStatus = $(`.comment-textarea[data-comment-form-id=${commentFormId}]`).attr("data-input-status")
      if (commentTextareaStatus != "ok") {
        if (commentTextareaStatus == "more") {
          $(`#comment-status[data-comment-form-id=${commentFormId}]`).text("Your comment must be at least 10 characters.")
        } else if (commentTextareaStatus == "toomuch") {
          $(`#comment-status[data-comment-form-id=${commentFormId}]`).text("Your comment should not be more than 300 characters.")
        }
        return false
      }

      $(`#comment-status[data-comment-form-id=${commentFormId}]`).text("")
      return true
    }
  </script>
</body>

</html>
