<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Lobby</title>
  <style>
    .content {
      padding-left: 0;
    }

    .upper-content {
      padding-left: 8px;
    }

    .lower-content {
      padding-left: 8px;
    }

    .event-list-container {
      width: 300px;
      max-height: 300px;
      overflow-y: scroll;
      border: 1px solid #ccc;
    }

    .event-list-title {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      background-color: beige;
    }

    .event-list-title p {
      font-size: 14px;
      font-weight: bold;
    }

    .event-list {
      display: flex;
      flex-direction: column-reverse;
    }

    .event-list-item {
      padding: 4px;
      padding-right: 12px;
      font-size: 12px;
      border-top: 1px solid #ccc;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .event-list-item:nth-child(odd) {
      background-color: #f0f0f0;
    }

    .event-list-item:nth-child(even) {
      background-color: #eff7ff;
    }

    .event-span {
      display: flex;
      gap: 4px;
    }

    .event-timestamp {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div class="upper-content">
              <h1>Lobby</h1>
              <p th:text="'System time: ' + ${data.time}"></p>
              <p th:text="'Bias: ' + ${data.bias}"></p>
              <div class="space-y-s"></div>
              <a class="link" href="/profile/random">Give me a random profile!</a>
              <div class="space-y-s"></div>
            </div>
            <hr>
            <div class="lower-content">
              <div class="space-y-s"></div>
              <div class="event-list-container">
                <div class="event-list-title">
                  <img src="/icons/unused/flat-flag.png" alt="Red flag" width="24px">
                  <p>Activity Feed</p>
                </div>
                <div class="event-list">
                  <div class="event-list-item" data-marker="1">No event yet!</div>
                </div>
              </div>
            </div>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <script>
    $(document).ready(function () {
      // initial fetch and once a minute fetch
      fetchEvents().then((data) => { updateEvents(data) })
      setInterval(() => {
        fetchEvents().then((data) => { updateEvents(data) })
      }, 3000);
    })

    async function fetchEvents() {
      try {
        const response = await fetch("/events", { method: 'GET' })
        if (response.ok) {
          return await response.json()
        } else {
          Toast.warn("Something is wrong!", "Failed to fetch events.", true)
          return []
        }
      } catch (err) {
        console.error("Fetch events error: ", err)
      }
    }

    function updateEvents(data) {
      if (data.length === 0) {
        return
      }

      const eventList = $(".event-list")
      if (eventList.children().first().attr("data-marker")) {
        eventList.children().first().remove()
      }

      for (const event of data.events) {
        const item = $("<div></div>").addClass("event-list-item")
        const span = $("<span></span>").addClass("event-span")
        const eventTimestamp = $("<p></p>").addClass("event-timestamp").text(formatTime(event.happenedAt))
        const eventText = $("<p></p>").addClass("event-text").text(event.text)
        eventList.append(item.append(span.append(eventTimestamp).append(eventText)))
      }

      while (eventList.children().length > 15) {
        eventList.children().first().remove()
      }
    }

    function formatTime(millis) {
      const date = new Date(Number(millis))
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${hours}:${minutes}`
    }
  </script>
</body>

</html>
