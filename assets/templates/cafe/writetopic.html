<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/site/favicon.ico">
  <link rel="stylesheet" href="/site/reset.css">
  <link rel="stylesheet" href="/site/base.css">
  <link rel="stylesheet" href="/site/toast.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="/site/toast.js"></script>
  <script src="/site/utils.js"></script>
  <title>Cafe.WriteTopic</title>
  <th:block th:replace="~{fragments/textfield :: textfield-styles}"></th:block>
  <style>
    .content {
      padding-left: 0;
    }

    .backlink {
      padding-left: 4px;
    }

    .post-container {
      width: fit-content;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    .content-section {
      display: flex;
      flex-direction: column;
      margin-top: 16px;
    }

    #content-textarea {
      width: 300px;
      height: 200px;
      resize: none;
      padding-right: 12px;
    }

    #topic-title-input {
      width: 300px;
    }

    .post-submit {
      width: fit-content;
      margin-top: 24px;
    }

    .post-status {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <div class="core">
        <header th:replace="~{fragments/topbar :: topbar(account=${data.account})}"></header>
        <main class="content-container">
          <div class="content">
            <div class="space-y-xs"></div>
            <a class="link backlink" th:text="'← Back to ' + ${#strings.capitalize(data.sectionName)}"></a>
            <form class="post-container">
              <h2>Write a topic</h2>
              <label for="topic-title-input">Title</label>
              <div
                th:replace="~{fragments/textfield :: tracking-inputtext(minLength=10, maxLength=80, placeholder='Write the title here...', inputId='topic-title-input', inputClasses='')}">
              </div>
              <label for="content-textarea">Content</label>
              <div
                th:replace="~{fragments/textfield :: tracking-textarea(minLength=20, maxLength=3000, placeholder='Write your topic here...', textareaId='content-textarea', textareaClasses='')}">
              </div>
              <button class="post-submit">Post</button>
              <p id="post-status" class="post-status"></p>
            </form>
          </div>
          <div th:replace="~{fragments/content-sidebar :: content-sidebar}"></div>
        </main>
      </div>
    </div>
    <ul th:replace="~{fragments/floating-toolbar :: floating-toolbar}"></ul>
    <div class="toast-container"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
  </div>

  <th:block th:replace="~{fragments/floating-toolbar :: floating-toolbar-script}"></th:block>
  <th:block th:replace="~{fragments/textfield :: textfield-scripts}"></th:block>
  <script>
    $(document).ready(function () {
      $(".post-submit").click(function (event) {
        postFormSubmitListener(event)
      })

      $(".backlink").attr('href', new URL('.', window.location.href).href.replace(/\/$/, ''))
    })

    function checkForm() {
      const titleStatus = $("#topic-title-input").attr("data-input-status")
      if (titleStatus != "ok") {
        if (titleStatus == "more") {
          $("#post-status").text("Title must be at least 10 characters.")
        } else if (titleStatus == "toomuch") {
          $("#post-status").text("Title should not be more than 80 characters.")
        }
        return false
      }

      const contentStatus = $("#content-textarea").attr("data-input-status")
      if (contentStatus != "ok") {
        if (contentStatus == "more") {
          $("#post-status").text("Content must be at least 20 characters.")
        } else if (contentStatus == "toomuch") {
          $("#post-status").text("Content should not be more than 3000 characters.")
        }
        return false
      }

      return true
    }

    async function postFormSubmitListener(event) {
      event.preventDefault()
      if (!checkForm()) return

      const titleText = $("#topic-title-input").val();
      const contentText = $("#content-textarea").val();
      const payload = { title: titleText, content: contentText }

      try {
        const response = await fetch(window.location.href, {
          method: 'POST',
          body: JSON.stringify(payload)
        })

        if (response.ok) {
          window.location.href = new URL('.', window.location.href).href.replace(/\/$/, '')
          return
        } else if (response.status == 400) {
          $("#post-status").text(await response.text())
        }
      } catch (err) {
        console.error("Post form error: ", err)
      }
    }
  </script>
</body>

</html>
